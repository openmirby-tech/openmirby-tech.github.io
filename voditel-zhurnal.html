<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>Журнал рейсов водителя</title>
<style>
:root{--bg:#f3f5f8;--c:#fff;--t:#17202a;--m:#55606c;--a:#c0392b;--ok:#1d7a3a;--w:#a35f00;--l:#cfd6de;--blue:#1b5fb0}
@media (prefers-color-scheme:dark){:root{--bg:#12161a;--c:#1c2228;--t:#f1f4f7;--m:#a6b0bb;--l:#34404b;--blue:#6aa8f0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:19px/1.45 system-ui,Arial,sans-serif;padding:12px 14px 70px;max-width:520px;margin:auto}
h1{font-size:24px;margin:8px 0 2px}h2{font-size:22px;margin:6px 0 8px}
.sub{color:var(--m);font-size:16px;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.tile{background:var(--c);border:2px solid var(--l);border-radius:18px;padding:16px 10px;text-align:center;font:inherit;color:var(--t);min-height:128px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tile b{font-size:21px;line-height:1.2}.tile small{color:var(--m);font-size:15px}
.tile i{font-style:normal;font-size:34px;line-height:1}
.t1{border-color:#2e86de}.t2{border-color:#e67e22}.t3{border-color:#27ae60}.t4{border-color:#8e44ad}.t5{border-color:#16a085}.t6{border-color:var(--a);background:var(--a);color:#fff}.t6 small{color:#fff}
.back{background:none;border:0;color:var(--blue);font:inherit;font-size:20px;padding:8px 0;margin-bottom:4px}
.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:14px;margin:10px 0}
label{display:block;font-size:18px;font-weight:600;margin:14px 0 4px}
.h{color:var(--m);font-size:16px;margin:0 0 6px}
input,select,textarea{min-width:0;width:100%;font:inherit;font-size:21px;padding:13px;border:2px solid var(--l);border-radius:12px;background:var(--bg);color:var(--t)}
.two{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;column-gap:10px;row-gap:0;align-items:start}.two>div{min-width:0;grid-row:span 3;display:grid;grid-template-rows:subgrid;row-gap:0}.two label{display:flex;align-items:flex-end;margin:14px 0 4px;line-height:1.2;min-height:0}.two .h{margin:4px 0 0;font-size:15px;line-height:1.3}.calc{background:var(--bg);border:2px solid var(--l);border-radius:14px;padding:12px;margin:14px 0}.calc table{width:100%;border-collapse:collapse;font-size:18px}.calc td{padding:5px 0}.calc td:last-child{text-align:right;font-weight:700;white-space:nowrap}.calc .big2{font-size:24px}.led{width:100%;border-collapse:collapse;font-size:16px}.led th,.led td{padding:6px 3px;border-bottom:1px solid var(--l);text-align:right}.led th:first-child,.led td:first-child{text-align:left}.t7{border-color:#d4ac0d}.opt{display:block;width:100%;text-align:left;border:2px solid var(--l);background:var(--c);color:var(--t);border-radius:14px;padding:12px 14px;margin:8px 0;font:inherit}.opt b{display:block;font-size:20px}.opt small{display:block;color:var(--m);font-size:16px;line-height:1.35}.opt.on{border-color:var(--blue);background:rgba(27,95,176,.12)}.opt.on.m{border-color:var(--w);background:rgba(230,126,34,.16)}.mt{border-left:6px solid var(--w);background:rgba(230,126,34,.16);padding:6px 10px;margin:6px 0;border-radius:8px;font-size:17px}.tgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tg{text-align:left;border:2px solid var(--l);background:var(--c);color:var(--t);border-radius:14px;padding:10px 12px;font:inherit;min-height:74px}.tg b{display:block;font-size:18px;line-height:1.2}.tg small{display:block;color:var(--m);font-size:15px;margin-top:3px;line-height:1.25}.tg.on{border-color:var(--blue);background:rgba(27,95,176,.10)}.tg.done b::after{content:' ✓';color:var(--ok)}.sec{border-top:2px dashed var(--l);margin-top:10px;padding-top:2px}.tile.wide{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0}
.chip{border:2px solid var(--l);background:var(--c);color:var(--t);border-radius:24px;padding:10px 16px;font:inherit;font-size:18px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.big{width:100%;font:inherit;font-size:22px;font-weight:700;border:0;border-radius:16px;padding:18px;margin:14px 0 6px;background:var(--ok);color:#fff}
.big.g{background:var(--c);color:var(--t);border:2px solid var(--l);font-weight:600}
.big.r{background:var(--a)}
.warn{background:#fff4e0;color:#7a4a00;border-left:6px solid var(--w);padding:10px 12px;border-radius:10px;font-size:17px;margin:10px 0}
@media (prefers-color-scheme:dark){.warn{background:#3a2c12;color:#ffd699}}
.okb{background:#e5f5ea;color:#14562a;border-left:6px solid var(--ok);padding:10px 12px;border-radius:10px;font-size:18px;margin:10px 0}
@media (prefers-color-scheme:dark){.okb{background:#16301f;color:#b8efc8}}
.rec{border-top:1px solid var(--l);padding:12px 0}.rec:first-child{border-top:0}
.rec b{font-size:20px}.rec .d{color:var(--m);font-size:17px}
.rec .row{display:flex;gap:10px;margin-top:8px}.rec button{flex:1;font:inherit;font-size:17px;padding:10px;border-radius:10px;border:2px solid var(--l);background:var(--c);color:var(--t)}
.rec button.del{color:var(--a)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.sum div{background:var(--bg);border-radius:12px;padding:10px;text-align:center;font-size:16px}.sum b{display:block;font-size:24px}
.step{display:flex;gap:12px;margin:12px 0;align-items:flex-start}.step span{flex:0 0 36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.fab{position:fixed;right:10px;bottom:14px;opacity:.92;z-index:50;width:54px;height:54px;border-radius:50%;border:0;background:var(--blue);color:#fff;font:700 28px/1 inherit;box-shadow:0 3px 10px rgba(0,0,0,.35)}.fab small{display:block;font-size:11px;font-weight:600}
#app:has(input:focus,textarea:focus,select:focus) .fab{display:none}#app{padding-bottom:80px}details.mm{background:var(--bg);border-radius:12px;margin:8px 0;padding:4px 12px}details.mm summary{font-size:19px;font-weight:700;padding:10px 0;cursor:pointer}details.mm .x{font-size:18px;line-height:1.45;padding-bottom:10px}details.mm .x p{margin:6px 0}
</style></head><body>
<div id="app"></div>
<script>
const K='bnv_voditel_v1';let D={drv:'',car:'',cars:[],rows:[],idle:[],fuel:[],exp:[],last:''};
try{D=Object.assign(D,JSON.parse(localStorage.getItem(K))||{})}catch(e){}
['rows','idle','fuel','exp','cars'].forEach(k=>D[k]=D[k]||[]);
if(D.car&&!D.cars.some(c=>c.plate===D.car))D.cars.push({plate:D.car,name:''});
const $=s=>document.querySelector(s),app=$('#app');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const dmy=d=>(d||'').split('-').reverse().join('.');
const pm=x=>{const q=/^(\d{1,2}):(\d{2})/.exec(x||'');return q?+q[1]*60+ +q[2]:null};
const span=r=>{const a=pm(r.out),b=pm(r.in);if(a===null||b===null)return 0;let d=b-a;if(d<=0)d+=1440;return d/60};
const shiftH=r=>Math.max(0,Math.round((span(r)-num(r.brk)/60)*100)/100);
function check(r){const w=[],t=span(r),s=shiftH(r),int=r.kind==='int';
 if(!int&&s>10)w.push('Смена получилась '+s+' ч. Это больше 10 часов. Скажите бухгалтеру или диспетчеру.');
 if(num(r.drive)>9)w.push('За рулём указано '+num(r.drive)+' ч. Это больше 9 часов.');
 if(t>(int?4.5:4)&&num(r.brk)<(int?45:20))w.push('Перерыв '+num(r.brk)+' мин. При такой смене нужен перерыв не меньше '+(int?'45':'20')+' минут.');
 return w}
const isSimple=()=>D.full!==1;
const TILES=[['shift','🚚','Смена целиком','записать за один раз, задним числом','t1'],['idle','⏳','Простой','ждал погрузку, границу','t2'],['fuel','⛽','Заправка','записать литры и чек','t3'],['fcalc','🧮','Топливо','остаток в баке, расчёт литров','t7'],['exp','🧾','Расход в пути','дорога, парковка, ремонт','t4'],['list','📋','Мои записи','посмотреть всё, что записал','t5'],['send','📤','Отправить бухгалтеру','в конце месяца','t6']];
let VIEW='home',EDIT=null,KIND='rb',CHIP={},AUTO={};
function go(v,id){VIEW=v;EDIT=id||null;window.scrollTo(0,0);draw()}
const hd=(t,sub)=>`<button class="back" data-go="home">← На главную</button><h2>${t}</h2>${sub?`<div class="sub">${sub}</div>`:''}`;
const HINT={odoS:'Цифры на спидометре перед выездом.',odoE:'Цифры на спидометре, когда вернулись.',fuelS:'Сколько литров в баке по указателю. Не знаете точно, впишите примерно.',filled:'Сколько литров залили за рейс. Не заправлялись: 0.',norm:'Литров на 100 км. Есть в «Мои данные» или в путевом листе.',ext:'Обычно 0.',out:'Время на часах при выезде.',in:'Время на часах при возвращении.',date:'Какого числа. Сегодня уже стоит.',from:'Когда начали стоять.',to:'Когда поехали дальше.',litres:'Сколько литров залили. Смотрите на чек.',sum:'Сумма из чека. Не знаете точно, впишите примерно.',note:'Что купили или за что заплатили. Номер чека, если есть.',place:'АЗС, город.',doc:'Номер внизу или вверху чека.'};
const hn=id=>HINT[id]?`<div class="h">${HINT[id]}</div>`:'';
const fld=(id,l,h,v,extra)=>`<label for="${id}">${l}</label>${(h||HINT[id])?`<div class="h">${h||HINT[id]}</div>`:''}<input id="${id}" value="${esc(v||'')}" ${extra||''}>`;
const f2=(id,l,v,extra)=>`<div><label for="${id}">${l}</label><input id="${id}" value="${esc(v==null?'':v)}" ${extra||'inputmode="decimal"'}>${hn(id)}</div>`;
const r1=x=>Math.round(x*10)/10;
const chips=(id,arr,cur)=>`<div class="chips" data-chips="${id}">${arr.map(a=>`<button type="button" class="chip ${String(cur)===String(a)?'on':''}" data-v="${esc(a)}">${esc(a)}</button>`).join('')}</div>`;
const carLbl=c=>c.plate+(c.name?' ('+c.name+')':'');
const carFull=c=>carLbl(c)+(num(c.norm)?', норма '+c.norm+' л/100 км':'');
function carFld(v){const has=D.cars.length>0,known=has&&D.cars.some(c=>c.plate===v);return `<label for="car">Автомобиль</label>${has?`<div class="chips" data-chips="car">${D.cars.map(c=>`<button type="button" class="chip ${c.plate===v?'on':''}" data-v="${esc(c.plate)}">${esc(carLbl(c))}</button>`).join('')}<button type="button" class="chip" data-v="__other">Другой</button></div>`:''}<div id="carOther" style="display:${has&&known?'none':''}"><input id="car" value="${esc(v||'')}" placeholder="государственный номер" autocapitalize="characters"></div>`}
function carOf(p){return D.cars.find(c=>c.plate===p)||{}}
const openShift=()=>D.rows.find(x=>x.open);
const nowT=()=>new Date().toTimeString().slice(0,5);
function prevShift(car,date,id){return D.rows.filter(x=>!x.open&&x.car===car&&x.id!==id&&(x.date||'')<date).sort((a,b)=>b.date.localeCompare(a.date)||(b.out||'').localeCompare(a.out||''))[0]}
function autoFilled(car,from,to){return r1(D.fuel.filter(f=>f.car===car&&f.date<=to&&(from?f.date>from:f.date===to)).reduce((q,f)=>q+num(f.litres),0))}
function fcalc(r,id){const has=v=>v!==undefined&&v!==null&&String(v)!=='';
 const km=(has(r.odoS)&&has(r.odoE)&&num(r.odoE)>=num(r.odoS))?r1(num(r.odoE)-num(r.odoS)):0;
 const norm=num(r.norm),ext=num(r.ext),spent=r1(km*norm/100*(1+ext/100));
 const pv=r.date?prevShift(r.car,r.date,id):null;
 const filled=has(r.filled)?num(r.filled):autoFilled(r.car,pv?pv.date:'',r.date);
 const start=has(r.fuelS)?num(r.fuelS):(pv&&has(pv.fuelE)?num(pv.fuelE):null);
 const end=start===null?null:r1(start+filled-spent);
 return {km,norm,ext,spent,filled,start,end,pv}}
function fuelNote(r){let m='';if(r.src==='mate')m+='<div class="mt">🔁 Забрал машину у напарника'+(r.mate?' ('+esc(r.mate)+')':'')+'. Начал с остатка '+(r.fuelS!==''&&r.fuelS!=null?num(r.fuelS)+' л':'?')+(r.odoS?', спидометр '+num(r.odoS):'')+'</div>';else if(r.src==='own')m+='<div class="d">Продолжил свою работу на этой машине</div>';if(r.hand)m+='<div class="mt">➡ Передал машину: '+esc(r.hand)+'</div>';return m+fuelNote2(r)}
function fuelNote2(r){if(!num(r.norm)&&!num(r.spent))return '';const f=fcalc(r,r.id);const sp=r.spent!=null&&r.spent!==''?num(r.spent):f.spent;
 let t='<br>Пробег '+f.km+' км, списано по норме '+sp+' л'+(f.filled?', заправлено '+f.filled+' л':'')+(r.fuelE!==''&&r.fuelE!=null?', остаток '+num(r.fuelE)+' л'+(r.fuelAuto?' (расчётный)':''):'');
 if(!r.fuelAuto&&f.end!==null&&r.fuelE!==''&&r.fuelE!=null){const d=r1(num(r.fuelE)-f.end);if(Math.abs(d)>=0.1)t+='<br>Фактический остаток '+(d<0?'меньше':'больше')+' расчётного на '+Math.abs(d)+' л'}
 return t}
function home(){
 const n=(a)=>a.length;
 return `<h1>Журнал рейсов</h1><div class="sub">${D.drv?'Водитель: <b>'+esc(D.drv)+'</b>':'Сначала нажмите «Мои данные» внизу, впишите фамилию и добавьте свои автомобили.'}</div>
 ${(!D.drv)?'<div class="warn">Впишите свои данные один раз, дальше они подставляются сами.</div>':''}
 ${reminder()}
 ${(()=>{const o=openShift();return o?`<div class="card" style="border:3px solid var(--ok)"><b style="font-size:21px">Смена идёт</b><div class="d" style="font-size:18px;margin:4px 0 8px">С ${esc(o.out||'?')}, ${dmy(o.date)}${o.car?', '+esc(o.car):''}</div><button class="big r" data-close="${o.id}" style="margin-top:4px">Закрыть смену</button></div>`:`<button class="big" data-go="start" style="font-size:24px;padding:22px">Начать смену</button>`})()}
 <div class="tiles">${TILES.filter(t=>!isSimple()||['fuel','list','send'].includes(t[0])).map(t=>`<button class="tile ${t[4]}${t[0]==='send'?' wide':''}" data-go="${t[0]}"><i>${t[1]}</i><b>${t[2]}</b><small>${t[3]}${t[0]==='list'?': '+(n(D.rows)+n(D.idle)+n(D.fuel)+n(D.exp)):''}</small></button>`).join('')}</div>
 <div class="tiles"><button class="tile" style="min-height:90px" data-go="me"><b>Мои данные</b></button><button class="tile" style="min-height:90px" data-go="help"><b>Как пользоваться</b></button></div>`}
function reminder(){if(!D.rows.length&&!D.idle.length&&!D.fuel.length&&!D.exp.length)return '';
 const dys=D.last?Math.floor((Date.now()-new Date(D.last).getTime())/864e5):null;
 if(dys===null)return '<div class="warn">Записи пока не отправлены бухгалтеру. Нажмите «Отправить бухгалтеру».</div>';
 if(dys>=7)return `<div class="warn">Вы отправляли файл ${dys} дн. назад. Отправьте свежий файл бухгалтеру.</div>`;return ''}
function me(){return hd('Мои данные','Заполняется один раз.')+`<div class="card">${D.cfgDrv?`<b style="font-size:20px">${esc(D.drv)}</b><div class="h">Внесено бухгалтером. Менять не нужно.</div><input type="hidden" id="drv" value="${esc(D.drv)}">`:fld('drv','Фамилия, имя, отчество','Так, как написано в приказе о приёме на работу.',D.drv,'autocomplete="name"')}</div>
 <div class="card"><b style="font-size:20px">Мои автомобили</b><div class="h">Все автомобили, на которых вы ездите. В каждой записи вы просто выбираете нужный.</div>
 ${D.cars.length?D.cars.map((c,i)=>`<div class="rec"><b>${esc(carFull(c))}</b>${c.cfg?'<div class="h">Выдан бухгалтером</div>':`<div class="row"><button data-normcar="${i}">Норма</button><button class="del" data-delcar="${i}">Убрать</button></div>`}</div>`).join(''):'<div class="sub">Пока ни одного. Добавьте ниже.</div>'}
 ${fld('newPlate','Государственный номер','Например 1234 AB-7.','','autocapitalize="characters"')}${fld('newName','Марка или название (необязательно)','Например MAN, Volvo, прицеп.','')}${fld('newNorm','Норма расхода, л на 100 км (необязательно)','Из путевого листа или приказа организации.','','inputmode="decimal"')}
 <button class="big g" id="addCar">Добавить автомобиль</button></div><button class="big" id="saveMe">Сохранить</button>${D.cfgMode?'':`<div class="card"><b style="font-size:20px">Режим журнала</b><div class="h">Простой: только смена и заправки. Полный: ещё простои, расходы в пути, перерывы, напарник, расчёт топлива.</div><div class="chips"><button type="button" class="chip ${isSimple()?'on':''}" data-mode="simple">Простой</button><button type="button" class="chip ${isSimple()?'':'on'}" data-mode="full">Полный</button></div></div>`}<div class="card"><b style="font-size:20px">Настройки от бухгалтера</b><div class="h">Если бухгалтер прислал файл настроек, загрузите его здесь. Фамилия и автомобили встанут сами.</div><label class="big g" style="display:block;text-align:center"><input type="file" id="cfgFile" accept=".json,application/json" style="display:none">Загрузить настройки из файла</label></div>`}
function shiftV(){window.__brkAsked=0;let r=EDIT?D.rows.find(x=>x.id===EDIT):{date:today(),car:D.car,kind:'rb'};const closing=!!(r&&r.open);if(closing){r=Object.assign({},r,{dateS:r.date,date:today(),in:nowT()})}KIND=r.kind||'rb';CHIP.brk=r.brk;AUTO=EDIT?{}:{fuelS:1,filled:1,norm:1,ext:1,odoS:1};CHIP.src=EDIT?(r.src||'own'):(prevShift(r.car,r.date,null)?'':'own');
 const has={brk:EDIT&&(closing||r.brk||r.drive),fuel:EDIT&&(closing||r.odoS||r.odoE||r.fuelS||r.norm),route:EDIT&&(r.route||r.kind==='int'),hand:EDIT&&r.hand};
 const tg=(k,ic,t)=>`<button type="button" class="tg ${has[k]?'on':''}" data-sec="${k}"><b>${ic} ${t}</b><small id="sum_${k}"></small></button>`;
 const sec=(k,h)=>`<div class="sec" id="sec_${k}" style="display:${has[k]?'':'none'}">${h}</div>`;
 if(closing&&isSimple())return simpleCloseV(r);
 return hd(closing?'Закрыть смену':EDIT?'Изменить смену':'Смена целиком',closing?'Выехали в '+esc(r.out||'?')+'. Укажите, когда вернулись, спидометр и остаток топлива.':'Главное ниже. Остальное откройте кнопкой, если нужно.')+`<div class="card">
 ${fld('date','Дата закрытия смены','',r.date,'type="date"')}
 ${carFld(r.car)}
 <label>С чего начинаете смену</label>
 <div data-chips="src"><button type="button" class="opt ${CHIP.src==='own'?'on':''}" data-v="own"><b>Продолжаю свою работу</b><small>Последним на машине ездил я.</small></button>
 <button type="button" class="opt m ${CHIP.src==='mate'?'on':''}" data-v="mate"><b>Забрал машину у напарника</b><small>После меня ездил другой водитель.</small></button></div>

 <details class="mm" open><summary>Как считается остаток топлива</summary><div class="x"><p><b>Остаток = было в баке + заправил − израсходовал.</b></p><p>Израсходовал = пробег, км × норма ÷ 100.</p><p>Пример: было 80 л, заправили 100 л, проехали 400 км при норме 25 л на 100 км. Израсходовано 400 × 25 ÷ 100 = 100 л. Остаток: 80 + 100 − 100 = 80 л.</p><p>Пробег = спидометр при возвращении минус спидометр при выезде. Всё это приложение считает само, вам нужно вписать только цифры.</p></div></details>
 <details class="mm"><summary>Сколько можно ехать за день и когда отдыхать</summary><div class="x"><p><b>Эти нормы для международных перевозок</b> (Европейское соглашение ЕСТР). Для перевозок внутри Беларуси действует своё положение о рабочем времени и времени отдыха водителей, спросите бухгалтера или руководителя, какие нормы у вас.</p><p><b>За рулём в сутки:</b> не больше 9 часов. Два раза в неделю можно до 10 часов.</p><p><b>За рулём за неделю:</b> не больше 56 часов. За две недели подряд не больше 90 часов.</p><p><b>Перерыв:</b> после 4,5 часов за рулём нужен перерыв не меньше 45 минут. Его можно разделить: сначала не меньше 15 минут, потом не меньше 30. Перерыв не считается ежедневным отдыхом.</p><p><b>Ежедневный отдых:</b> нормальный не меньше 11 часов. Сокращённый от 9 до 11 часов, таких не больше трёх между двумя недельными отдыхами.</p><p><b>Недельный отдых:</b> нормальный не меньше 45 часов. Сокращённый (меньше 45 часов, но не меньше 24) нужно потом компенсировать. Недельный отдых должен начаться не позже, чем через шесть суток после предыдущего.</p><p>Приложение подскажет, если за смену указано больше 9 часов за рулём или нет нужного перерыва.</p><div class="h">Основание: ЕСТР, статьи 6, 7 и 8 (для Беларуси соглашение в силе с 02.10.1993).</div></div></details>

 on('cp',()=>{const t='Водитель: '+D.drv+'\n'+D.rows.map(r=>dmy(r.date)+' '+r.car+' '+r.out+'-'+r.in+' перерыв '+num(r.brk)+' мин, за рулём '+num(r.drive)+' ч, спидометр '+r.odoS+'-'+r.odoE+' '+(r.route||'')+(r.src==='mate'?'. Принял машину от напарника: '+r.mate+', остаток '+(r.fuelS||'?')+' л, спидометр '+(r.odoS||'?'):'')+(r.hand?'. Передал машину: '+r.hand:'')).concat(D.idle.map(r=>'Простой '+dmy(r.date)+' '+(r.hours||'')+' ч '+(r.why||''))).concat(D.fuel.map(r=>'Заправка '+dmy(r.date)+' '+r.litres+' л '+r.sum+' '+r.cur+' '+(r.place||''))).concat(D.exp.map(r=>'Расход '+dmy(r.date)+' '+r.kind+' '+r.sum+' '+r.cur)).join('\n');try{navigator.clipboard.writeText(t).then(()=>{$('#msg').innerHTML='<div class="okb">Скопировано. Вставьте в сообщение бухгалтеру.</div>'})}catch(e){$('#msg').innerHTML='<div class="warn">Не получилось скопировать. Скачайте файл.</div>'}});
 ['out','in','brk','drive','car','date','odoS','odoE','fuelS','filled','norm','ext','fuelE'].forEach(i=>{const e=document.getElementById(i);if(e&&(VIEW==='shift'||VIEW==='start'))e.oninput=()=>{if(['fuelS','filled','norm','ext','odoS'].includes(i))AUTO[i]=0;if(i==='car'||i==='date'){AUTO.fuelS=AUTO.filled=AUTO.norm=AUTO.ext=AUTO.odoS=1}live()}});
 if(VIEW==='fcalc')fcBind()}
function rememberCar(p){p=(p||'').trim();if(!p)return;if(!D.cars.some(c=>c.plate===p))D.cars.push({plate:p,name:''});D.car=p;save()}
function done(msg){if(AGAIN){const v=AGAIN;go(v);app.insertAdjacentHTML('afterbegin','<div class="okb">'+esc(msg)+' Можно записать следующее.</div>');return}VIEW='home';EDIT=null;window.scrollTo(0,0);draw();app.insertAdjacentHTML('afterbegin','<div class="okb">'+esc(msg)+'</div>');setTimeout(()=>{const o=app.querySelector('.okb');if(o&&VIEW==='home')o.remove()},4000)}
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.dataset.mode){D.full=t.dataset.mode==='full'?1:0;save();draw();return}
 if(t.dataset.sec){const sc=$('#sec_'+t.dataset.sec),o=sc.style.display==='none';sc.style.display=o?'':'none';t.classList.toggle('on',o);return}
 if(t.dataset.close){go('shift',t.dataset.close);return}
 if(t.dataset.go){go(t.dataset.go);return}
 if(t.dataset.hand){const r=D.rows.find(x=>x.id===t.dataset.hand);if(r){const m='Передаю автомобиль '+r.car+' ('+dmy(r.date)+'). Спидометр: '+(r.odoE||'не указан')+' км. Остаток топлива в баке: '+(r.fuelE||'не указан')+' л'+(r.fuelAuto?' (расчётный, проверьте по указателю)':'')+'. Передал: '+(D.drv||'')+'.';try{navigator.clipboard.writeText(m).then(()=>alert('Текст скопирован. Вставьте его в Телеграм или Вайбер напарнику.'),()=>prompt('Скопируйте текст и отправьте напарнику:',m))}catch(e){prompt('Скопируйте текст и отправьте напарнику:',m)}}return}
 if(t.dataset.normcar!==undefined){const c=D.cars[+t.dataset.normcar],v=prompt('Норма расхода для '+c.plate+', литров на 100 км:',c.norm||'');if(v!==null){c.norm=num(v)||'';save();draw()}return}
 if(t.dataset.delcar!==undefined){const i=+t.dataset.delcar;if(confirm('Убрать этот автомобиль из списка? Записи останутся.')){D.cars.splice(i,1);if(D.car&&!D.cars.some(c=>c.plate===D.car))D.car=D.cars[0]?D.cars[0].plate:'';save();draw()}return}
 if(t.dataset.edit){const [k,id]=t.dataset.edit.split(':');go(k==='shift'?'shift':k,id);return}
 if(t.dataset.del){const [k,id]=t.dataset.del.split(':');if(confirm('Удалить эту запись?')){const m={shift:'rows',idle:'idle',fuel:'fuel',exp:'exp'}[k];D[m]=D[m].filter(x=>x.id!==id);save();draw()}return}
 const box=t.closest('[data-chips]');if(box){const id=box.dataset.chips,v=t.dataset.v;
  if(id==='filt'){CHIP.f=v;draw();return}
  if(id==='src'){CHIP.src=v;$('#startBox').style.display='';box.querySelectorAll('.opt').forEach(c=>c.classList.toggle('on',c===t));$('#mateBox').style.display=v==='mate'?'':'none';if(v==='mate'){['fuelS','odoS'].forEach(i=>{const e=document.getElementById(i);if(e&&AUTO[i])e.value='';AUTO[i]=0})}else{['fuelS','odoS'].forEach(i=>{const e=document.getElementById(i);if(e&&!e.value)AUTO[i]=1})}live();return}
  if(id==='fcar'){CHIP.fcar=v;draw();return}
  if(id==='kind'){KIND=v;box.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===t));live();return}
  if(id==='why'){const inp=$('#why');let L=whyList(inp.value);L=L.includes(v)?L.filter(x=>x!==v):L.concat(v);inp.value=L.join(', ');box.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',L.includes(c.dataset.v)));return}
  CHIP[id]=v;box.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===t));
  if(id==='car'&&v==='__other'){box.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===t));const o=$('#carOther');o.style.display='';const ci=$('#car');ci.value='';ci.focus();CHIP.car='';return}
  const inp=document.getElementById(id);if(inp&&(id==='brk'||id==='why'||id==='car')){inp.value=v;if(id==='car'){const o=$('#carOther');if(o&&D.cars.length)o.style.display='none'}}if(id==='brk')live();if(id==='car'&&(VIEW==='shift'||VIEW==='start')){AUTO.fuelS=AUTO.filled=AUTO.norm=AUTO.ext=AUTO.odoS=1;live()}}});

function applyCfg(c){if(!c||c.bnv!=='voditel-cfg')return false;
 if(c.drv){D.drv=c.drv;D.cfgDrv=c.drv}
 if(c.full!==undefined){D.full=c.full?1:0;D.cfgMode=1}
 D.cfgCars=(c.cars||[]).map(x=>String(x.plate||'').toUpperCase());
 (c.cars||[]).forEach(x=>{const p=String(x.plate||'').toUpperCase();if(!p)return;let o=D.cars.find(q=>q.plate===p);if(!o){o={plate:p};D.cars.push(o)}o.name=x.name||o.name||'';if(x.norm)o.norm=x.norm;o.cfg=1});
 if(!D.car&&D.cars.length)D.car=D.cars[0].plate;save();return true}
function cfgFromHash(){try{const m=location.hash.match(/#cfg=([\w\-]+)/);if(!m)return false;
 const j=decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/'))));const ok=applyCfg(JSON.parse(j));
 try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
 if(ok)setTimeout(()=>alert('Настройки от бухгалтера загружены: '+D.drv+'. Теперь можно начинать смену.'),300);return ok}catch(e){return false}}
cfgFromHash();
document.addEventListener('change',e=>{if(e.target.id!=='cfgFile')return;const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{if(applyCfg(JSON.parse(r.result))){alert('Настройки загружены: '+D.drv);draw()}else alert('Это не файл настроек от бухгалтера.')}catch(x){alert('Не удалось прочитать файл.')}};r.readAsText(f)});
draw();
</script></body></html>
